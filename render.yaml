
# Render.com Infrastructure as Code Blueprint
# AuraSkin — AI Skin Intelligence & Personalized Skincare Planner

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: auraskin-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: project_scaffold/backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: auraskin-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: '["https://auraskin-frontend.onrender.com"]'
      - key: FRONTEND_URL
        value: https://auraskin-frontend.onrender.com

  # 2. React / Vite Frontend Static Site
  - type: web
    name: auraskin-frontend
    runtime: static
    rootDir: project_scaffold/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://auraskin-backend.onrender.com/api
      - key: VITE_HEALTH_URL
        value: https://auraskin-backend.onrender.com/health

databases:
  # 3. PostgreSQL Database
  - name: auraskin-db
    plan: free
    region: oregon
    databaseName: auraskin_db
    user: auraskin_user
    ipAllowList: []
